# The stand is driven by demo/lib.sh; addresses and subnet come from demo/.env,
# which demo/generate-configs.sh writes. Always drive it through the scripts:
#
#   ./demo/up.sh        stand up, left running
#   ./demo/record.sh    record the failover GIF
#
# Teardown: docker compose --env-file demo/.env -f demo/docker-compose.yml -p nylon-demo down --remove-orphans
services:
  alice:
    image: nylon-demo-node:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: debug
    container_name: nylon-demo-alice
    hostname: alice
    cap_add: [NET_ADMIN]
    privileged: true
    volumes:
      - ./configs/central.yaml:/app/config/central.yaml:ro
      - ./configs/alice.yaml:/app/config/node.yaml:ro
    entrypoint: ["/usr/local/bin/nylon", "run", "-c", "/app/config/central.yaml", "-n", "/app/config/node.yaml"]
    networks:
      mesh:
        ipv4_address: ${ALICE_IP}

  bob:
    image: nylon-demo-node:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: debug
    container_name: nylon-demo-bob
    hostname: bob
    cap_add: [NET_ADMIN]
    privileged: true
    volumes:
      - ./configs/central.yaml:/app/config/central.yaml:ro
      - ./configs/bob.yaml:/app/config/node.yaml:ro
    entrypoint: ["/usr/local/bin/nylon", "run", "-c", "/app/config/central.yaml", "-n", "/app/config/node.yaml"]
    networks:
      mesh:
        ipv4_address: ${BOB_IP}

  charlie:
    image: nylon-demo-node:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: debug
    container_name: nylon-demo-charlie
    hostname: charlie
    cap_add: [NET_ADMIN]
    privileged: true
    volumes:
      - ./configs/central.yaml:/app/config/central.yaml:ro
      - ./configs/charlie.yaml:/app/config/node.yaml:ro
    entrypoint: ["/usr/local/bin/nylon", "run", "-c", "/app/config/central.yaml", "-n", "/app/config/node.yaml"]
    networks:
      mesh:
        ipv4_address: ${CHARLIE_IP}

networks:
  mesh:
    driver: bridge
    ipam:
      config:
        - subnet: ${MESH_SUBNET}
