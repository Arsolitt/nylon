# nylon-lb DaemonSet: one speaker replica per node (allocated IPs are bound on
# lo and announced via prefixes.d on every node for externalTrafficPolicy=Cluster).
# Apply rbac.yaml first.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nylon-lb
  namespace: kube-system
  labels:
    app: nylon-lb
spec:
  selector:
    matchLabels:
      app: nylon-lb
  template:
    metadata:
      labels:
        app: nylon-lb
    spec:
      serviceAccountName: nylon-lb
      # The speaker must own the node's network namespace: the /32 bind has to
      # land on the node's lo, otherwise the node does not hold the addresses it
      # announces. ClusterFirstWithHostNet keeps cluster DNS resolvable here.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Run on every node, including control-plane.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
        - key: node-role.kubernetes.io/master
          operator: Exists
      containers:
        - name: nylon-lb
          # Published by .github/workflows/release.yml (GoReleaser): release tags
          # carry the :<version> tag, only stable releases move :latest. For a
          # local image use: make image-nylon-lb
          image: ghcr.io/arsolitt/nylon/nylon-lb:latest
          imagePullPolicy: IfNotPresent
          # NET_ADMIN for the lo address binding; root because netlink needs it.
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["NET_ADMIN"]
          # Pools are named and repeatable (--pool=name=cidr): every node must
          # run the same --pool set with the same --exclude, and each Service
          # selects its pool via the nylon.io/lb-pool annotation.
          # --lb-class scopes nylon-lb to Services carrying exactly that
          # spec.loadBalancerClass (edit per cluster), so other class-scoped
          # LB controllers can coexist; drop the flag to claim every
          # LoadBalancer Service.
          args:
            - --pool=shared=10.110.0.0/24
            - --exclude=10.110.0.1
            - --lb-class=nylon
          env:
            # The container hostname is the pod name, not the node name; pass
            # --node-name=$(NODE_NAME) in args when running with
            # externalTrafficPolicy=Local.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: prefixes
              mountPath: /etc/nylon/prefixes.d
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9633
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9633
      volumes:
        - name: prefixes
          hostPath:
            path: /etc/nylon/prefixes.d
            type: DirectoryOrCreate
